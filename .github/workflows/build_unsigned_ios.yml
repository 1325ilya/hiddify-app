name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-unsigned-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Frameworks
        run: |
          make ios-prepare

      - name: Build Flutter iOS (Unsigned)
        run: |
          flutter build ios --no-codesign --release

      - name: Package Unsigned IPAs (Standard and GBox-compatible)
        run: |
          # 1. Package Standard IPA (with PlugIns/VPNExtension.appex)
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Hiddify-Unsigned.ipa Payload
          
          # 2. Package GBox-compatible IPA (with PlugIns folder stripped to prevent signature mismatch crashes)
          mkdir -p Payload-GBox
          cp -r build/ios/iphoneos/Runner.app Payload-GBox/
          rm -rf Payload-GBox/Runner.app/PlugIns
          mv Payload Payload-Standard
          mv Payload-GBox Payload
          zip -r Hiddify-GBox.ipa Payload
          
          # 3. Organize outputs
          mkdir -p out
          mv Hiddify-Unsigned.ipa out/
          mv Hiddify-GBox.ipa out/

      - name: Upload Unsigned IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-unsigned-ios-ipa
          path: out/
          retention-days: 5
